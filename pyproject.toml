[project]
name = "ipixel"
version = "0.1.0"
description = "BLE control library for iPixel Color LED matrix panels (LED_BLE_xxxxxxxx)"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "pillow>=10.1",
]

[project.scripts]
ipixel = "ipixel.cli:main"

[project.gui-scripts]
ipixel-studio = "ipixel.studio.app:main"

[project.optional-dependencies]
studio = [
    "keyring>=25",
    "pyside6-essentials>=6.8",
    "qasync>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipixel"]
